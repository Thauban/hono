name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Prepare log directory
        run: mkdir -p log

      - name: Prisma generate
        run: bun prisma generate

      - name: Unit tests
        run: bun run test --project unit --run

      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false